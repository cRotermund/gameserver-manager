apiVersion: apps/v1
kind: Deployment
metadata:
  name: control-plane-api
  labels:
    app: control-plane-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: control-plane-api
  template:
    metadata:
      labels:
        app: control-plane-api
    spec:
      containers:
        - name: control-plane-api
          image: control-plane-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # -- SERVER CONFIGURATION --
            - name: PORT
              value: "8080"
            # -- GSM FUNCTION CONFIGURATION -- 
            - name: GAMESERVER_ISSERVER_TAG_KEY
              value: "IsGameServer"
            - name: GAMESERVER_NAME_TAG_KEY
              value: "Name"
            - name: GAMESERVER_DESCRIPTOR_TAG_KEY
              value: "Game"
            # -- AWS CONFIGURATION --
            - name: AWS_REGION
              value: "us-east-1"
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: AWS_SECRET_ACCESS_KEY
            - name: AWS_ROLE_ARN
              valueFrom:
                secretKeyRef:
                  name: control-plane-api-secret
                  key: AWS_ROLE_ARN
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base
  - control-plane-api-external-secret.yaml
  - control-bot-external-secret.yaml

namespace: chad-applications

images:
  - name: control-plane-api
    newName: ghcr.io/crotermund/gameserver-manager/control-plane-api
    newTag: latest
  - name: control-bot
    newName: ghcr.io/crotermund/gameserver-manager/control-bot
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: control-plane-web
    patch: |
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: control-plane-web
  - target:
      kind: Service
      name: control-plane-web
    patch: |
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: control-plane-web
  - target:
      kind: Deployment
      name: control-bot
    patch: |-
      - op: add
        path: /spec/template/spec/imagePullSecrets
        value:
          - name: ghcr-pull-secret
  - target:
      kind: Deployment
      name: control-plane-api
    patch: |
      - op: replace
        path: /spec/replicas
        value: 2

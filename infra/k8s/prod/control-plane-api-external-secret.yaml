apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: control-plane-api
  labels:
    app: control-plane-api
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: control-plane-api-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: /kubernetes/appsecrets/gameserver-manager/control-plane-api/aws-access-key-id
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: /kubernetes/appsecrets/gameserver-manager/control-plane-api/aws-secret-access-key
    - secretKey: AWS_ROLE_ARN
      remoteRef:
        key: /kubernetes/appsecrets/gameserver-manager/control-plane-api/aws-role-arn

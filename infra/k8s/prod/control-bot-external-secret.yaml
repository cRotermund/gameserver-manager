apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: control-bot
  labels:
    app: control-bot
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-parameter-store
    kind: ClusterSecretStore
  target:
    name: control-bot-secret
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      type: Opaque
  data:
    - secretKey: DISCORD_TOKEN
      remoteRef:
        key: /kubernetes/appsecrets/gameserver-manager/control-bot/discord-token
        conversionStrategy: Default
        decodingStrategy: None
        metadataPolicy: None

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

images:
  - name: control-plane-api
    newName: localhost/control-plane-api
  - name: control-plane-web
    newName: localhost/control-plane-web
  - name: control-bot
    newName: localhost/control-bot

secretGenerator:
  - name: control-bot-secret
    envs:
      - bot.env
  - name: control-plane-api-secret
    envs:
      - api.env

patches:
  - target:
      kind: Deployment
      name: control-plane-api
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: LOG_LEVEL
          value: "DEBUG"